version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/reach-agent
    schedule:
      interval: weekly
    groups:
      reach-agent:
        patterns: ["*"]
    # @types/node suit la version majeure du runtime (Node 24).
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /apps/worker
    schedule:
      interval: weekly
    groups:
      worker:
        patterns: ["*"]
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # L'écosystème npm de Dependabot gère aussi pnpm (pnpm-lock.yaml).
  - package-ecosystem: npm
    directory: /front
    schedule:
      interval: weekly
    groups:
      front:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
